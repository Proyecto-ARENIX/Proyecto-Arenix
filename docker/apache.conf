# no mostrar la version de apache
ServerTokens Prod
ServerSignature Off
ServerName localhost

# deja que funcionen los .htaccess del proyecto
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# pocos procesos para no pasarse del limite de memoria del contenedor
<IfModule mpm_prefork_module>
    StartServers          2
    MinSpareServers       2
    MaxSpareServers       5
    MaxRequestWorkers     20
    MaxConnectionsPerChild 1000
</IfModule>

KeepAlive On
KeepAliveTimeout 3
Timeout 60

# comprime html, css y js
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml
</IfModule>

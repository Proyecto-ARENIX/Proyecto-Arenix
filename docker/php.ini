; no mostrar la version de php ni los errores al visitante
expose_php = Off
display_errors = Off
log_errors = On

date.timezone = ${TZ}
memory_limit = 128M

; fotos de hasta 2 MB, varias por formulario (logo y fotos de jugadores)
upload_max_filesize = 4M
post_max_size = 64M
max_file_uploads = 50

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; el codigo viene dentro de la imagen y no cambia, no hace falta revisar los archivos
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
